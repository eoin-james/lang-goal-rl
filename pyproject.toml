[project]
name = "lang-goal-rl"
version = "0.1.0"
description = "Staged research repo: goal-conditioned RL with a continuous goal space derived from frozen language embeddings"
readme = "README.md"
authors = [
    { name = "eoin-james", email = "eoinmc.james@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gymnasium-robotics>=1.4.2",
    "imageio>=2.37.4",
    "sentence-transformers>=5.6.1",
    "stable-baselines3[extra]>=2.9.0",
    # torch is imported directly (classifiers, regression heads, goal encoder) --
    # declared explicitly, and pinned to the CPU wheel index below: this project
    # never uses a GPU, and the default CUDA-enabled Linux wheels segfault on
    # import on GPU-less machines (caught by the first real CI run).
    "torch>=2.9",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
